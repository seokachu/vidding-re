# PR 과 main 푸시마다 도는 검사.
#
# 빌드는 넣지 않았다 — Supabase 키가 있어야 하고, 그 왕복이 붙으면 검사가
# 느려지고 흔들린다. 여기서 잡으려는 것은 "코드가 스스로 어긋난 것"이다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 아는 경로 목록이 src/app 과 맞는가.
      # 어긋나면 새 화면이 비회원에게 404 로 보이거나, 없는 주소가 로그인으로 간다
      - run: pnpm check:routes

      - run: pnpm typecheck

      - run: pnpm lint
